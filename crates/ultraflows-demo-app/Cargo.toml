[package]
name = "ultraflows-demo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "External demo app: a separate binary that registers tasks with an UltraFlows server, triggers them, and works them as a remote worker."

[[bin]]
name = "ultraflows-demo-app"
path = "src/main.rs"

[dependencies]
ultraflows-sdk = { path = "../ultraflows-sdk" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
