[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultraflows"
version = "0.1.0"
description = "Python SDK for UltraFlows — durable workflows for FastAPI and LangGraph apps"
readme = "README.md"
requires-python = ">=3.10"
license = "Elastic-2.0"
authors = [{ name = "Roger" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ultraflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
